<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're offline — Bechdou</title>
  <meta name="theme-color" content="#6e0f1f" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <style>
    :root {
      --merlot: #6e0f1f;
      --cream: #f7f3ee;
      --ink: #231719;
      --ink-soft: #5a4245;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cream);
      color: var(--ink);
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
      gap: 1.5rem;
    }
    .brand-mark {
      width: 56px;
      height: 56px;
      background: var(--merlot);
      color: #fff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.6rem;
      font-weight: 700;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--ink);
    }
    p {
      font-size: .95rem;
      color: var(--ink-soft);
      max-width: 340px;
      line-height: 1.6;
    }
    .wifi-icon {
      color: var(--ink-soft);
      opacity: .45;
    }
    button {
      background: var(--merlot);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: .75rem 1.75rem;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: .02em;
    }
    button:hover { background: #8e3341; }
    small {
      font-size: .78rem;
      color: var(--ink-soft);
      opacity: .6;
    }
  </style>
</head>
<body>
  <div class="brand-mark">B</div>

  <svg class="wifi-icon" viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M1 6s4.5-4 11-4 11 4 11 4"/>
    <path d="M5 10s2.5-2.5 7-2.5 7 2.5 7 2.5"/>
    <path d="M9 14s1.5-1.5 3-1.5 3 1.5 3 1.5"/>
    <line x1="12" y1="18" x2="12.01" y2="18" stroke-width="2.5"/>
    <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="1.6"/>
  </svg>

  <h1>You're offline</h1>
  <p>Check your connection and try again. Your Bechdou saved pieces and favourites will be ready when you're back online.</p>

  <button onclick="location.reload()">Try again</button>
  <small>Bechdou — Pakistan's fashion resale marketplace</small>
</body>
</html>
